name: Actualizar índices de la calculadora de alquileres

on:
  schedule:
    - cron: "17 11 * * *"   # todos los días, 8:17 de Argentina
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar ICL, CER, UVA (BCRA) e IPC (INDEC)
        run: python alquileres/actualizar_indices.py
      - name: Guardar si cambió algo
        run: |
          if git diff --quiet alquileres/indices.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add alquileres/indices.json
          git commit -m "Índices de alquileres al $(date -u +%F)"
          git push
